[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truevision-generation-lab"
version = "0.1.0"
description = "Standalone TrueVision state-media generation and region snip lab."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python",
  "mss",
]

[tool.pytest.ini_options]
pythonpath = ["scripts", "modules", "."]

[tool.setuptools]
packages = [
  "trueframegen",
  "truevision_runtime",
  "truevision_runtime.av_tools",
  "truevision_runtime.document_state",
  "truevision_runtime.llm_adapter",
  "truevision_runtime.learning_intake",
  "truevision_runtime.rendering",
  "truevision_runtime.state_patterns",
  "truevision_runtime.studio",
]
py-modules = ["screen_resonance_state"]
